x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://theft-alloy:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "prometheus"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOG_FORMAT: "%(asctime)s %(levelname)s [%(name)s] [trace_id=%(otelTraceID)s span_id=%(otelSpanID)s] %(message)s"

services:
  backend:
    build: ./services/api
    image: theft-backend:dev
    container_name: theft-backend
    networks:
      - edge
      - data
      - observability
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./services/api/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-backend"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0"
      PROMETHEUS_EXPORTER_PORT: "9464"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=theft-detection-platform_edge"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || Path(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.middlewares=gateway-chain@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    volumes:
      - ./services/api/tests:/app/tests
      - ./config/mongodb/tls/ca.crt:/run/secrets/mongo_ca.crt:ro
      - ./config/mongodb/secrets/mongo_api_password:/run/secrets/mongo_password:ro
      - ./config/redis/api_redis_password:/run/secrets/api_redis_password:ro
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.5
    container_name: theft-traefik
    networks:
      - edge
      - observability
    user: "0:0"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./config/traefik/certs:/etc/traefik/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ai:
    build: ./services/ai
    image: theft-ai:dev
    container_name: theft-ai
    networks:
      - observability
      - data
    user: "1000:1000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-ai"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-ai"
      PROMETHEUS_EXPORTER_PORT: "9464"
    volumes:
      - ./ml:/app/ai-model:ro
      - ./config/alertmanager/webhook_token:/run/secrets/webhook_token:ro
      - ./config/redis/ai_redis_password:/run/secrets/ai_redis_password:ro
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ai"]
    restart: unless-stopped

  camera:
    build: ./services/camera
    image: theft-camera:dev
    container_name: theft-camera
    networks:
      - observability
      - data
    user: "1000:1000"
    group_add:
      - "44"
    volumes:
      - ./config/redis/camera_redis_password:/run/secrets/camera_redis_password:ro
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-camera"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-camera"
      PROMETHEUS_EXPORTER_PORT: "9464"
      CAMERA_ID: "cam-01"
      DEVICE_PATH: "/dev/video0"
      FRAME_WIDTH: "1920"
      FRAME_HEIGHT: "1080"
      AI_HOST: "ai"
      AI_PORT: "50051"
    devices:
      - /dev/video2:/dev/video0
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9464/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    profiles: ["ai"]
    restart: unless-stopped

  detect-gate:
    build: ./services/detect-gate
    image: theft-detect-gate:dev
    container_name: theft-detect-gate
    networks:
      - observability
      - data
    user: "1000:1000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-detect-gate"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-detect-gate"
      PROMETHEUS_EXPORTER_PORT: "9464"
      CAMERA_ID: "cam-01"
      SESSION_ID: "1"
      AI_HOST: "ai"
      AI_PORT: "50051"
    volumes:
      - ./config/redis/gate_redis_password:/run/secrets/gate_redis_password:ro
    depends_on:
      ai:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ai"]
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification
      target: server
    image: notification-server:dev
    container_name: notification
    networks:
      - data
      - observability
    user: "1000:1000"
    env_file:
      - ./services/api/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "notification"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=notification"
      PROMETHEUS_EXPORTER_PORT: "9464"
    volumes:
      - ./ml:/app/ai-model:ro
      - ./config/alertmanager/webhook_token:/run/secrets/webhook_token:ro
      - ./config/mongodb/tls/ca.crt:/run/secrets/mongo_ca.crt:ro
      - ./config/mongodb/secrets/mongo_notification_password:/run/secrets/mongo_password:ro
      - ./config/redis/broker_redis_password:/run/secrets/broker_redis_password:ro
      - ./config/redis/notify_redis_password:/run/secrets/notify_redis_password:ro
    depends_on:
      redis-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  notification-worker:
    build:
      context: ./services/notification
      target: worker
    image: notification-worker:dev
    container_name: notification-worker
    networks:
      - data
      - observability
    user: "1000:1000"
    command: ["celery", "-A", "app.worker.bootstrap", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1"]
    env_file:
      - ./services/api/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "notification-worker"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=notification-worker"
      PROMETHEUS_EXPORTER_PORT: "9465"
    volumes:
      - ./ml:/app/ai-model:ro
      - ./config/mongodb/tls/ca.crt:/run/secrets/mongo_ca.crt:ro
      - ./config/mongodb/secrets/mongo_notification_password:/run/secrets/mongo_password:ro
      - ./config/telegram/bot_token:/run/secrets/telegram_bot_token:ro
      - ./config/redis/broker_redis_password:/run/secrets/broker_redis_password:ro
      - ./config/redis/notify_redis_password:/run/secrets/notify_redis_password:ro
    depends_on:
      redis-broker:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.bootstrap inspect ping -t 5 > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  notification-beat:
    build:
      context: ./services/notification
      target: worker
    image: notification-worker:dev
    container_name: notification-beat
    networks:
      - data
      - observability
    user: "1000:1000"
    command: ["celery", "-A", "app.worker.bootstrap", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    env_file:
      - ./services/api/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "notification-beat"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=notification-beat"
      PROMETHEUS_EXPORTER_PORT: "9466"
    volumes:
      - ./config/mongodb/tls/ca.crt:/run/secrets/mongo_ca.crt:ro
      - ./config/mongodb/secrets/mongo_notification_password:/run/secrets/mongo_password:ro
      - ./config/redis/broker_redis_password:/run/secrets/broker_redis_password:ro
      - ./config/redis/notify_redis_password:/run/secrets/notify_redis_password:ro
    depends_on:
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: theft-mongo
    networks:
      - data
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    user: "999:999"
    group_add:
      - "972"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo_data:/data/db
      - ./config/mongodb/mongod.conf:/etc/mongo/mongod.conf:ro
      - ./config/mongodb/tls/mongod.pem:/etc/mongo/tls/mongod.pem:ro
      - ./config/mongodb/tls/ca.crt:/etc/mongo/tls/ca.crt:ro
      - ./config/mongodb/init:/docker-entrypoint-initdb.d:ro
      - ./config/mongodb/secrets/mongo_root_password:/run/secrets/mongo_root_password:ro
      - ./config/mongodb/secrets/mongo_api_password:/run/secrets/mongo_api_password:ro
      - ./config/mongodb/secrets/mongo_notification_password:/run/secrets/mongo_notification_password:ro
      - ./config/mongodb/secrets/mongo_monitor_password:/run/secrets/mongo_monitor_password:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --tls
        - --tlsCAFile
        - /etc/mongo/tls/ca.crt
        - --host
        - mongo
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: theft-redis
    networks:
      - data
    user: "999:999"
    group_add:
      - "971"
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(sed -n 's/^requirepass //p' /etc/redis/redis.conf)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-broker:
    image: redis:7.2-alpine
    container_name: theft-redis-broker
    networks:
      - data
    user: "999:999"
    group_add:
      - "971"
    command: ["redis-server", "/etc/redis/redis-broker.conf"]
    volumes:
      - redis_broker_data:/data
      - ./config/redis/redis-broker.conf:/etc/redis/redis-broker.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(sed -n 's/^requirepass //p' /etc/redis/redis-broker.conf)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-stream:
    image: redis:7.2-alpine
    container_name: theft-redis-stream
    restart: unless-stopped
    networks:
      - data
    user: "999:999"
    group_add:
      - "971"
    command: ["redis-server", "/etc/redis/redis-stream.conf"]
    volumes:
      - ./config/redis/redis-stream.conf:/etc/redis/redis-stream.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(sed -n 's/^requirepass //p' /etc/redis/redis-stream.conf)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.12.0
    container_name: theft-prometheus
    networks:
      - observability
    user: "65534:65534"
    group_add:
      - "1971"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.listen-address=:9090"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      node-exporter:
        condition: service_healthy
      mongodb-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:v1.8.2
    container_name: theft-node-exporter
    networks:
      - observability
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mongodb-exporter:
    profiles: ["observability"]
    image: percona/mongodb_exporter:0.40
    container_name: theft-mongodb-exporter
    networks:
      - data
      - observability
    command:
      - "--mongodb.uri=mongodb://${MONGO_EXPORTER_USERNAME}:${MONGO_EXPORTER_PASSWORD}@theft-mongo:27017/admin?tls=true&tlsInsecure=true"
      - "--collect-all"
      - "--compatible-mode"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.65.0
    container_name: theft-redis-exporter
    networks:
      - data
      - observability
    environment:
      REDIS_USER: "exporter"
      REDIS_ADDR: "redis://theft-redis:6379"
      REDIS_PASSWORD_FILE: "/run/secrets/exporter_pw"
    volumes:
      - ./config/redis/exporter_redis_password:/run/secrets/exporter_pw:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-broker-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.65.0
    container_name: theft-redis-broker-exporter
    networks:
      - data
      - observability
    environment:
      REDIS_USER: "exporter"
      REDIS_ADDR: "redis://theft-redis-broker:6379"
      REDIS_PASSWORD_FILE: "/run/secrets/broker_exporter_pw"
    volumes:
      - ./config/redis/broker_exporter_redis_password:/run/secrets/broker_exporter_pw:ro
    depends_on:
      redis-broker:
        condition: service_healthy
    restart: unless-stopped

  redis-stream-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.65.0
    container_name: theft-redis-stream-exporter
    networks:
      - data
      - observability
    environment:
      REDIS_USER: "exporter"
      REDIS_ADDR: "redis://theft-redis-stream:6379"
      REDIS_PASSWORD_FILE: "/run/secrets/stream_exporter_pw"
    volumes:
      - ./config/redis/stream_exporter_redis_password:/run/secrets/stream_exporter_pw:ro
    depends_on:
      redis-stream:
        condition: service_healthy
    restart: unless-stopped

  nvidia-gpu-exporter:
    profiles: ["observability"]
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: theft-nvidia-gpu-exporter
    networks:
      - observability
    group_add:
      - "44"
      - "990"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9835' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  netdata:
      profiles: ["observability"]
      image: netdata/netdata:stable
      container_name: theft-netdata
      networks:
        - observability
      hostname: legion-5
      pid: host
      ports:
        - "127.0.0.1:19999:19999"
      cap_add:
        - SYS_PTRACE
      environment:
        DOCKER_HOST: "/var/run/docker.sock"
      volumes:
        - netdata_config:/etc/netdata
        - netdata_lib:/var/lib/netdata
        - netdata_cache:/var/cache/netdata
        - /etc/passwd:/host/etc/passwd:ro
        - /etc/group:/host/etc/group:ro
        - /etc/localtime:/etc/localtime:ro
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /etc/os-release:/host/etc/os-release:ro
        - /var/log:/host/var/log:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19999/api/v1/info > /dev/null || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 60s
      restart: unless-stopped

  portainer:
    profiles: ["observability"]
    image: portainer/portainer-ce:lts
    container_name: theft-portainer
    networks:
      - observability
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.4
    container_name: theft-grafana
    networks:
      - observability
    user: "472:472"
    group_add:
      - "1972"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    container_name: theft-loki
    networks:
      - observability
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    container_name: theft-alertmanager
    networks:
      - observability
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./config/alertmanager/webhook_token:/etc/alertmanager/webhook_token:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.5.1
    container_name: theft-alloy
    networks:
      - observability
    user: "0:0"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    container_name: theft-tempo
    networks:
      - observability
    user: "10001:10001"
    group_add:
      - "1973"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo_data:/var/tempo
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  redis_broker_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  alertmanager_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
  portainer_data:
