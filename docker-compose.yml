x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://theft-alloy:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "prometheus"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOG_FORMAT: "%(asctime)s %(levelname)s [%(name)s] [trace_id=%(otelTraceID)s span_id=%(otelSpanID)s] %(message)s"

services:
  backend-migrate:
    build:
      context: ./services/api
      target: runtime
    image: theft-backend:dev
    container_name: theft-backend-migrate
    command: ["python", "-m", "app.migrations.runner", "up"]
    networks:
      - data
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-theft_detection_db}
      OTEL_SDK_DISABLED: "true"
    volumes:
      - type: bind
        source: ./config/mongodb/tls/ca.crt
        target: /run/secrets/mongo_ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/mongodb/secrets/mongo_api_password
        target: /run/secrets/mongo_password
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./services/api
      target: runtime
    image: theft-backend:dev
    container_name: theft-backend
    stop_grace_period: 15s
    networks:
      - edge
      - data
      - observability
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./services/api/.env
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-backend"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0"
      PROMETHEUS_EXPORTER_PORT: "9464"
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-Africa/Casablanca}
    depends_on:
      mongo:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=theft-detection-platform_edge"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.middlewares=api-chain@file"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    volumes:
      - type: bind
        source: ./config/mongodb/tls/ca.crt
        target: /run/secrets/mongo_ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/mongodb/secrets/mongo_api_password
        target: /run/secrets/mongo_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/redis/api_redis_password
        target: /run/secrets/api_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/redis/stream_reader_redis_password
        target: /run/secrets/stream_reader_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/api/tls.crt
        target: /run/secrets/api_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/api/tls.key
        target: /run/secrets/api_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/api_tls_ca
        read_only: true
        bind:
          create_host_path: false
      - ai_snapshots:/app/snapshots:ro
    restart: "no"

  backend-test:
    build:
      context: ./services/api
      target: test
    image: theft-backend-test:dev
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
    container_name: theft-backend-test
    profiles:
      - test
    networks:
      - edge
      - data
      - observability
    env_file:
      - ./services/api/.env
    volumes:
      - type: bind
        source: ./services/api/tests
        target: /app/tests
        bind:
          create_host_path: false
      - type: bind
        source: ./config/mongodb/tls/ca.crt
        target: /run/secrets/mongo_ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/mongodb/secrets/mongo_api_password
        target: /run/secrets/mongo_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/redis/api_redis_password
        target: /run/secrets/api_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/redis/stream_reader_redis_password
        target: /run/secrets/stream_reader_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/api/tls.crt
        target: /run/secrets/api_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/api/tls.key
        target: /run/secrets/api_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/api_tls_ca
        read_only: true
        bind:
          create_host_path: false
      - ai_snapshots:/app/snapshots:ro

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime
    image: theft-web:dev
    container_name: theft-web
    restart: "no"
    networks:
      - edge
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
      AUTH_BASE_URL: http://auth:8000
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-Africa/Casablanca}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=theft-detection-platform_edge"
      - "traefik.http.routers.web.rule=Host(`localhost`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.middlewares=gateway-chain@file"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.7.5
    container_name: theft-traefik
    networks:
      edge:
        ipv4_address: 172.31.240.10
      observability:
    user: "0:0"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - type: bind
        source: ./config/traefik/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/traefik/dynamic.yml
        target: /etc/traefik/dynamic.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/traefik/certs
        target: /etc/traefik/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  ai-models:
    build:
      context: ./ml
      target: models
    image: theft-ai-models:dev
    scale: 0
    profiles: ["ai"]

  ai:
    build: ./services/ai
    image: theft-ai:dev
    container_name: theft-ai
    env_file:
      - ./services/ai/.env
    networks:
      - observability
      - data
    user: "1000:1000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-ai"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-ai"
      PROMETHEUS_EXPORTER_PORT: "9464"
    volumes:
      - type: image
        source: theft-ai-models:dev
        target: /app/ai-model/models
      - type: bind
        source: ./config/alertmanager/webhook_token
        target: /run/secrets/webhook_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/redis/ai_redis_password
        target: /run/secrets/ai_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ai/tls.crt
        target: /run/secrets/ai_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ai/tls.key
        target: /run/secrets/ai_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/ai_tls_ca
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/auth/detector_password
        target: /run/secrets/alert_password
        read_only: true
        bind:
          create_host_path: false
      - ai_snapshots:/app/snapshots
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ai"]
    restart: "no"

  camera:
    build: ./services/camera
    image: theft-camera:dev
    container_name: theft-camera
    env_file:
      - ./services/camera/.env
    networks:
      - observability
      - data
    user: "1000:1000"
    group_add:
      - "44"
    device_cgroup_rules:
      - "c 81:* rmw"
    volumes:
      - type: bind
        source: ./config/redis/camera_redis_password
        target: /run/secrets/camera_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/camera/tls.crt
        target: /run/secrets/camera_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/camera/tls.key
        target: /run/secrets/camera_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/camera_tls_ca
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /dev
        target: /dev
        bind:
          create_host_path: false
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-camera"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-camera"
      PROMETHEUS_EXPORTER_PORT: "9464"
      CAMERA_ID: "cam-a"
      DEVICE_PATH: "/dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_3521BF9F-video-index0"
      FRAME_WIDTH: "1280"
      FRAME_HEIGHT: "720"
      AI_HOST: "ai"
      AI_PORT: "50051"
    depends_on:
      ai:
        condition: service_healthy
    profiles: ["ai"]
    restart: "no"

  detect-gate:
    build: ./services/detect-gate
    image: theft-detect-gate:dev
    container_name: theft-detect-gate
    env_file:
      - ./services/detect-gate/.env
    networks:
      - observability
      - data
    user: "1000:1000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "theft-detect-gate"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=theft-detect-gate"
      PROMETHEUS_EXPORTER_PORT: "9464"
      CAMERA_ID: "cam-a"
      SESSION_ID: "1"
      AI_HOST: "ai"
      AI_PORT: "50051"
    volumes:
      - type: bind
        source: ./config/redis/gate_redis_password
        target: /run/secrets/gate_redis_password
        read_only: true
        bind:
          create_host_path: false
      - type: image
        source: theft-ai-models:dev
        target: /app/ai-model/models
      - type: bind
        source: ./config/pki/detect-gate/tls.crt
        target: /run/secrets/gate_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/detect-gate/tls.key
        target: /run/secrets/gate_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/gate_tls_ca
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ai:
        condition: service_healthy
      camera:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ai"]
    restart: "no"

  auth-service:
      build:
        context: ./services/auth
      image: auth:dev
      container_name: auth
      networks:
        - edge
        - data
        - observability
      user: "1000:1000"
      env_file:
        - ./services/auth/.env
      environment:
        AUTH_HTTP_PORT: "8000"
        AUTH_GRPC_PORT: "50053"
        AUTH_TRUSTED_PROXIES: '["127.0.0.0/8","::1/128","172.31.240.10/32"]'
        AUTH_POSTGRES_SSL_MODE: disable
      ports:
        - "127.0.0.1:8002:8000"
      volumes:
        - type: bind
          source: ./config/postgres/auth_app_postgres_password
          target: /run/secrets/postgres_password
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/redis/auth_redis_password
          target: /run/secrets/auth_redis_password
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/auth/jwt_private.pem
          target: /run/secrets/jwt_private_key
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/auth/jwt_public.pem
          target: /run/secrets/jwt_public_key
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/pki/auth/tls.crt
          target: /run/secrets/auth_tls_cert
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/pki/auth/tls.key
          target: /run/secrets/auth_tls_key
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/pki/ca/ca.crt
          target: /run/secrets/auth_tls_ca
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/audit/pseudonym_key
          target: /run/secrets/auth_pseudonym_key
          read_only: true
          bind:
            create_host_path: false
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
        audit-service:
          condition: service_healthy
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=theft-detection-platform_edge"
        - "traefik.http.routers.auth.rule=Host(`localhost`) && PathPrefix(`/auth`)"
        - "traefik.http.routers.auth.priority=100"
        - "traefik.http.routers.auth.entrypoints=websecure"
        - "traefik.http.routers.auth.tls=true"
        - "traefik.http.routers.auth.middlewares=api-chain@file"
        - "traefik.http.routers.authlogin.rule=Host(`localhost`) && Path(`/auth/login`)"
        - "traefik.http.routers.authlogin.priority=200"
        - "traefik.http.routers.authlogin.entrypoints=websecure"
        - "traefik.http.routers.authlogin.tls=true"
        - "traefik.http.routers.authlogin.middlewares=login-chain@file"
        - "traefik.http.routers.authlogin.service=auth"
        - "traefik.http.services.auth.loadbalancer.server.port=8000"
      restart: "no"
      stop_grace_period: 20s

  audit-service:
        build:
          context: ./services/audit
        image: audit:dev
        container_name: audit
        networks:
          - data
          - observability
        user: "1000:1000"
        env_file:
          - ./services/audit/.env
        environment:
          <<: *otel-env
          OTEL_SERVICE_NAME: "audit"
          OTEL_RESOURCE_ATTRIBUTES: "service.namespace=theft,deployment.environment=local,service.version=0.1.0,service.name=audit"
          AUDIT_POSTGRES_SSL_MODE: disable
          AUDIT_GRPC_PORT: "50054"
        ports:
          - "127.0.0.1:50054:50054"
        volumes:
          - type: bind
            source: ./config/postgres/audit_app_postgres_password
            target: /run/secrets/audit_app_postgres_password
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/redis/audit_redis_password
            target: /run/secrets/audit_redis_password
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/audit/pseudonym_key
            target: /run/secrets/audit_pseudonym_key
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/audit/checkpoint_private.pem
            target: /run/secrets/audit_checkpoint_private_key
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/audit/checkpoint_public.pem
            target: /run/secrets/audit_checkpoint_public_key
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/pki/audit/tls.crt
            target: /run/secrets/audit_tls_cert
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/pki/audit/tls.key
            target: /run/secrets/audit_tls_key
            read_only: true
            bind:
              create_host_path: false
          - type: bind
            source: ./config/pki/ca/ca.crt
            target: /run/secrets/audit_tls_ca
            read_only: true
            bind:
              create_host_path: false
        depends_on:
          postgres:
            condition: service_healthy
          redis:
            condition: service_started
        restart: "no"

  audit-operator:
      build:
        context: ./services/audit
      image: audit:dev
      container_name: audit-operator
      profiles:
        - ops
      networks:
        - data
      user: "1000:1000"
      env_file:
        - ./services/audit/.env
      environment:
        AUDIT_POSTGRES_HOST: "postgres"
        AUDIT_POSTGRES_SSL_MODE: disable
      volumes:
        - type: bind
          source: ./config/postgres/audit_owner_postgres_password
          target: /run/secrets/audit_owner_postgres_password
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/postgres/audit_app_postgres_password
          target: /run/secrets/audit_app_postgres_password
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/audit/pseudonym_key
          target: /run/secrets/audit_pseudonym_key
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: ./config/audit/checkpoint_public.pem
          target: /run/secrets/audit_checkpoint_public_key
          read_only: true
          bind:
            create_host_path: false
      depends_on:
        postgres:
          condition: service_healthy
      entrypoint: ["sleep", "infinity"]
      restart: "no"

  auth-operator:
    build:
      context: ./services/auth
    image: auth:dev
    container_name: auth-operator
    profiles:
      - ops
    networks:
      - data
    user: "1000:1000"
    env_file:
      - ./services/auth/.env
    environment:
      AUTH_POSTGRES_HOST: "postgres"
      AUTH_POSTGRES_SSL_MODE: disable
    volumes:
      - type: bind
        source: ./config/postgres/auth_owner_postgres_password
        target: /run/secrets/auth_owner_postgres_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/postgres/auth_app_postgres_password
        target: /run/secrets/postgres_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/auth/jwt_public.pem
        target: /run/secrets/jwt_public_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/audit/pseudonym_key
        target: /run/secrets/auth_pseudonym_key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    restart: "no"

  audit-harness:
    build:
      context: ./services/audit
    image: audit:dev
    container_name: audit-harness
    profiles:
      - harness
    networks:
      - data
    user: "1000:1000"
    env_file:
      - ./services/audit/.env
    environment:
      HARNESS_POSTGRES_HOST: "postgres-harness"
      AUDIT_POSTGRES_HOST: "postgres-harness"
      AUDIT_POSTGRES_SSL_MODE: disable
    volumes:
      - type: bind
        source: ./config/postgres/harness_postgres_password
        target: /run/secrets/audit_owner_postgres_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/postgres/harness_postgres_password
        target: /run/secrets/audit_app_postgres_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
