        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/exporter/tls.key
        target: /run/secrets/exporter_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/exporter_tls_ca
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis-broker:
        condition: service_healthy
    restart: "no"

  redis-stream-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.65.0
    container_name: theft-redis-stream-exporter
    networks:
      - data
      - observability
    environment:
      REDIS_USER: "exporter"
      REDIS_ADDR: "rediss://theft-redis-stream:6380"
      REDIS_PASSWORD_FILE: "/run/secrets/stream_exporter_pw"
      REDIS_EXPORTER_TLS_CLIENT_CERT_FILE: "/run/secrets/exporter_tls_cert"
      REDIS_EXPORTER_TLS_CLIENT_KEY_FILE: "/run/secrets/exporter_tls_key"
      REDIS_EXPORTER_TLS_CA_CERT_FILE: "/run/secrets/exporter_tls_ca"
    volumes:
      - type: bind
        source: ./config/redis/stream_exporter_redis_password
        target: /run/secrets/stream_exporter_pw
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/exporter/tls.crt
        target: /run/secrets/exporter_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/exporter/tls.key
        target: /run/secrets/exporter_tls_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/pki/ca/ca.crt
        target: /run/secrets/exporter_tls_ca
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis-stream:
        condition: service_healthy
    restart: "no"

  nvidia-gpu-exporter:
    profiles: ["observability"]
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: theft-nvidia-gpu-exporter
    networks:
      - observability
    group_add:
      - "44"
      - "990"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9835' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: "no"

  netdata:
      profiles: ["observability"]
      image: netdata/netdata:stable
      container_name: theft-netdata
      networks:
        - observability
      hostname: legion-5
      pid: host
      ports:
        - "127.0.0.1:19999:19999"
      cap_add:
        - SYS_PTRACE
      environment:
        DOCKER_HOST: "/var/run/docker.sock"
      volumes:
        - netdata_config:/etc/netdata
        - netdata_lib:/var/lib/netdata
        - netdata_cache:/var/cache/netdata
        - type: bind
          source: /etc/passwd
          target: /host/etc/passwd
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /etc/group
          target: /host/etc/group
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /etc/localtime
          target: /etc/localtime
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /proc
          target: /host/proc
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /sys
          target: /host/sys
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /etc/os-release
          target: /host/etc/os-release
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /var/log
          target: /host/var/log
          read_only: true
          bind:
            create_host_path: false
        - type: bind
          source: /var/run/docker.sock
          target: /var/run/docker.sock
          read_only: true
          bind:
            create_host_path: false
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19999/api/v1/info > /dev/null || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 60s
      restart: "no"

  portainer:
    profiles: ["observability"]
    image: portainer/portainer-ce:lts
    container_name: theft-portainer
    networks:
      - observability
    restart: "no"
    command: -H unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - portainer_data:/data

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.4
    container_name: theft-grafana
    networks:
      - observability
    user: "472:472"
    group_add:
      - "1972"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./config/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/grafana/admin_password
        target: /run/secrets/grafana_admin_password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: "no"

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    container_name: theft-loki
    networks:
      - observability
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - type: bind
        source: ./config/loki/loki-config.yml
        target: /etc/loki/loki-config.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    container_name: theft-alertmanager
    networks:
      - observability
    user: "65534:65534"
    group_add:
      - "1974"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - type: bind
        source: ./config/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/alertmanager/webhook_token
        target: /etc/alertmanager/webhook_token
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.5.1
    container_name: theft-alloy
    networks:
      - observability
    user: "0:0"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - alloy_data:/var/lib/alloy/data
      - type: bind
        source: ./config/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      loki:
        condition: service_healthy
    restart: "no"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    container_name: theft-tempo
    networks:
      - observability
    user: "10001:10001"
    group_add:
      - "1973"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo_data:/var/tempo
      - type: bind
        source: ./config/tempo/tempo.yml
        target: /etc/tempo/tempo.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1
          ip_range: 172.31.240.128/25
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1
          ip_range: 172.21.0.128/25

volumes:
  mongo_data:
  redis_data:
  redis_broker_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  alertmanager_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
  portainer_data:
  ai_snapshots:
