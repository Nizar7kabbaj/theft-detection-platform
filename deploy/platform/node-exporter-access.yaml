apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: node-exporter
  namespace: node-exporter
spec:
  secretName: node-exporter-tls
  commonName: node-exporter
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  dnsNames:
    - node-exporter.node-exporter.svc
  issuerRef:
    name: theft-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-exporter-scrape
  namespace: node-exporter
rules:
  - apiGroups: [""]
    resources: ["services/node-exporter"]
    resourceNames: ["node-exporter"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-exporter-scrape
  namespace: node-exporter
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-exporter-scrape
