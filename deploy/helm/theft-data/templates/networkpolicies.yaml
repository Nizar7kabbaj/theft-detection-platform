{{- $np := .Values.networkPolicy }}
{{- if $np.enabled }}
{{- $prefix := $np.accessLabelPrefix }}
{{- $amb := $np.ambient.enabled }}
{{- $hb := $np.ambient.hbonePort }}
{{- with .Values.postgres }}
{{- if .enabled }}
{{- if not $np.apiServer.cidr }}
{{- fail "networkPolicy.apiServer.cidr is required when postgres is enabled" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" "postgres" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ printf "%s/postgres" $prefix }}: "true"
      ports:
        - port: 5432
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.cnpgOperator.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.cnpgOperator.podLabels | nindent 14 }}
      ports:
        - port: 8000
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
    {{- if $amb }}
    - from:
        - ipBlock:
            cidr: {{ $np.ambient.probeSource }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - port: {{ $np.dns.port }}
          protocol: UDP
        - port: {{ $np.dns.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ $np.apiServer.cidr }}
      ports:
        - port: {{ $np.apiServer.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.mongo.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" "mongo" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "data.selectorLabels" (dict "root" $ "name" "mongo") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ printf "%s/mongo" $prefix }}: "true"
      ports:
        - port: 27017
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
    {{- if $amb }}
    - from:
        - ipBlock:
            cidr: {{ $np.ambient.probeSource }}
    {{- end }}
  egress: []
{{- end }}
{{- range $name, $r := .Values.redis.instances }}
{{- if $r.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" $name "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "data.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{ printf "%s/%s" $prefix $name }}: "true"
      ports:
        - port: 6380
          protocol: TCP
        {{- if $amb }}
        - port: {{ $hb }}
          protocol: TCP
        {{- end }}
    {{- if $amb }}
    - from:
        - ipBlock:
            cidr: {{ $np.ambient.probeSource }}
    {{- end }}
  egress: []
{{- end }}
{{- end }}
{{- end }}
