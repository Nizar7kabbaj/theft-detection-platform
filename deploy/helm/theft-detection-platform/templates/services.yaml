{{- range $name, $comp := .Values.components }}
{{- if and $comp.enabled $comp.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "theft.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "theft.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    {{- range $comp.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
