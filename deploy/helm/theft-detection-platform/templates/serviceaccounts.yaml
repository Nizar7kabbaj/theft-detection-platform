{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
{{- include "theft.serviceAccount" (dict "root" $ "name" $name "hook" false) }}
{{- end }}
{{- end }}
{{- range $name, $m := .Values.migrations }}
{{- $raw := index $.Values.components $m.component }}
{{- if and $m.enabled $raw $raw.enabled }}
{{- include "theft.serviceAccount" (dict "root" $ "name" $name "hook" true) }}
{{- end }}
{{- end }}
{{- with .Values.seed }}
{{- $raw := index $.Values.components .component }}
{{- if and .enabled $raw $raw.enabled }}
{{- include "theft.serviceAccount" (dict "root" $ "name" (printf "%s-seed" .component) "hook" false) }}
{{- end }}
{{- end }}
{{- if .Values.auditOperator.run }}
{{- include "theft.serviceAccount" (dict "root" $ "name" "audit-operator" "hook" false) }}
{{- end }}
