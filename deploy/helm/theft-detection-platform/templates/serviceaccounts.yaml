{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "theft.labels" (dict "root" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
