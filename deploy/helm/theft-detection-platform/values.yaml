      STATS_TTL_SECONDS: "10"
      PUBLISH_QUEUE_DEPTH: "30"
      IDLE_FPS: "15"
      ACTIVE_FPS: "30"
      LOG_LEVEL: INFO
      DEBUG: "false"
    secret:
      enabled: true
      name: camera-secrets
      mountPath: /run/secrets
    tls:
      identity: camera
      filePrefix: camera
    resources:
      requests:
        cpu: 100m
        memory: 160Mi
      limits:
        memory: 160Mi
    extraVolumes: []
    extraVolumeMounts: []
    gpu:
      enabled: false

  detect-gate:
    enabled: true
    image:
      repository: theft-detect-gate
      tag: dev
      digest: ""
    otel:
      enabled: true
      serviceName: theft-detect-gate
    writablePaths:
