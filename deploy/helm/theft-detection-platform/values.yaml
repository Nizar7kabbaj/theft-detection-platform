      enabled: true
      ports:
        - name: grpc
          port: 50051
          targetPort: grpc
    env:
      PROMETHEUS_EXPORTER_PORT: "9464"
      REDIS_HOST: redis-stream
      REDIS_TLS: "true"
      REDIS_DB: "2"
      REDIS_USER: ai
      NODE_STATS_KEY: stats:node
      NODE_STATS_INTERVAL_SECONDS: "2.0"
      NODE_STATS_TTL_SECONDS: "15"
      NODE_STATS_DEVICE_INDEX: "0"
      DEVICE: cuda
      ANOMALY_THRESHOLD: "0.6"
      TRACKER_TTL_SECONDS: "60"
      LOG_LEVEL: INFO
      DEBUG: "false"
      CONCEALMENT_MISSING_SECONDS: "1.0"
      API_BASE_URL: http://backend:8000
      AUTH_BASE_URL: http://auth:8000
    secret:
      enabled: true
      name: ai-secrets
      mountPath: /run/secrets
    tls:
      identity: ai
      filePrefix: ai
    snapshots:
      mount: true
      readOnly: false
      path: /app/snapshots
    models:
      mount: true
      path: /app/ai-model/models
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        memory: 2Gi
    extraVolumes: []
    extraVolumeMounts: []
    gpu:
      enabled: true
      count: 1

  camera:
    enabled: false
    image:
      repository: theft-camera
      tag: dev
      digest: ""
    otel:
      enabled: true
      serviceName: theft-camera
    writablePaths:
      - /tmp
      - /app/run
    ports:
      - name: metrics
        containerPort: 9464
    service:
      enabled: false
    env:
      PROMETHEUS_EXPORTER_PORT: "9464"
      CAMERA_ID: cam-a
      DEVICE_PATH: /dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_3521BF9F-video-index0
      FRAME_WIDTH: "1280"
      FRAME_HEIGHT: "720"
      AI_HOST: ai
      AI_PORT: "50051"
      REDIS_HOST: redis-stream
      REDIS_TLS: "true"
      REDIS_DB: "2"
      REDIS_USER: camera
