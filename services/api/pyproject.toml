[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "public api gateway for the theft-detection-platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "motor==3.7.1",
    "pymongo==4.18.2",
    "python-multipart==0.0.31",
    "aiofiles==25.1.0",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "Pillow==12.3.0",
    "redis==5.2.1",
    "cryptography==50.0.2",
    "grpcio==1.71.2",
    "python-json-logger==3.2.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-pymongo==0.50b0",
    "opentelemetry-instrumentation-logging==0.50b0",
    "opentelemetry-instrumentation-grpc==0.50b0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "opentelemetry-exporter-prometheus==0.50b0",
    "anyio==4.14.2",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "protobuf==5.29.6",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "grpcio-health-checking==1.71.2",
    "typing-extensions==4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "grpcio-tools==1.71.2",
    "ruff==0.16.2",
    "pytest-timeout>=2.4.0",
    "trustme>=1.2.1",
    "typing-extensions>=4.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: pure unit tests, no external services",
    "integration: tests against running mongo, redis, or grpc",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/grpc_gen/*",
    "app/__pycache__/*",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend = "../../ruff.toml"
