[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notification"
version = "0.1.0"
description = "notification gRPC server and Celery worker for the theft-detection-platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "celery==5.4.0",
    "redis==5.2.1",
    "requests==2.33.1",
    "motor==3.7.1",
    "pydantic-settings==2.14.2",
    "python-json-logger==3.2.1",
    "prometheus-client>=0.21,<0.22",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "opentelemetry-exporter-prometheus==0.50b0",
    "opentelemetry-instrumentation-logging==0.50b0",
    "opentelemetry-instrumentation-celery==0.50b0",
    "opentelemetry-instrumentation-pymongo==0.50b0",
]

[project.optional-dependencies]
server = [
    "cryptography==50.0.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.46.0",
    "grpcio==1.71.2",
    "grpcio-health-checking==1.71.2",
    "opentelemetry-instrumentation-grpc==0.50b0",
]
worker = [
    "opentelemetry-instrumentation-requests==0.50b0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "grpcio-tools==1.71.2",
    "ruff==0.16.2",
    "testcontainers[mongodb]>=4.8,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: pure unit tests, no external services",
    "integration: tests against running mongo, redis, or grpc",
]
filterwarnings = [
    "ignore:.*alias.*has no effect.*:UserWarning:pydantic",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/server/grpc_gen/*",
    "app/__pycache__/*",
    "app/server/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
