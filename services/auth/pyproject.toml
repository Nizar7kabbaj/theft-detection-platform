[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth"
version = "0.1.0"
description = "identity and token verification service for the theft-detection-platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "grpcio==1.71.2",
    "grpcio-health-checking==1.71.2",
    "grpcio-reflection==1.71.2",
    "protobuf==5.29.6",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    "python-json-logger==3.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.13.0",
    "cryptography==50.0.0",
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "grpcio-tools==1.71.2",
    "ruff==0.16.2",
    "pytest-cov==7.1.0",
    "testcontainers[postgres,redis]==4.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-ra"]
markers = [
    "unit: pure unit tests, no external services",
    "integration: tests against a running grpc or http server",
]

[tool.ruff]
extend = "../../ruff.toml"
