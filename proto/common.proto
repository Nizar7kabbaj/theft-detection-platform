syntax = "proto3";

package theftdetection.v1;

message Bbox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message Keypoint {
  float x = 1;
  float y = 2;
  float confidence = 3;
}

message Person {
  int32 track_id = 1;
  Bbox bbox = 2;
  repeated Keypoint keypoints = 3;
}

message Object {
  string class_name = 1;
  Bbox bbox = 2;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_NOTICE = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_CRITICAL = 4;
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_OBJECT_PROXIMITY = 1;
  ALERT_TYPE_BENDING = 2;
  ALERT_TYPE_LOITERING = 3;
}
