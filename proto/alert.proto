syntax = "proto3";

package theftdetection.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";

message Concealment {
  int32 object_track_id = 1;
  string object_class = 2;
  Bbox last_seen_bbox = 3;
  int32 last_seen_frame = 4;
  int32 missing_frames = 5;
  int32 wrist_index = 6;
  float wrist_x = 7;
  float wrist_y = 8;
  float grab_distance = 9;
  int32 person_track_id = 10;
}

message Alert {
  string alert_id = 1;
  int64 session_id = 2;
  int32 frame_index = 3;
  google.protobuf.Timestamp occurred_at = 4;
  optional string camera_id = 5;
  Person person = 6;
  Object object = 7;
  Severity severity = 8;
  AlertType alert_type = 9;
  optional string snapshot_path = 10;
  int32 frame_width = 11;
  int32 frame_height = 12;
  optional Concealment concealment = 13;
  optional float classifier_score = 14;
  optional string classifier_state = 15;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACCEPTED = 1;
  STATUS_RATE_LIMITED = 2;
  STATUS_FAILED = 3;
}

message SendAlertReply {
  Status status = 1;
  google.protobuf.Timestamp delivered_at = 2;
}

service AlertService {
  rpc SendAlert(Alert) returns (SendAlertReply);
}
