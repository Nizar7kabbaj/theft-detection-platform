syntax = "proto3";

package theftdetection.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

message Alert {
  string alert_id = 1;
  int64 session_id = 2;
  int32 frame_index = 3;
  string timestamp = 4;
  optional string camera_id = 5;
  google.protobuf.Struct person = 6;
  google.protobuf.Struct object = 7;
  string severity = 8;
  optional string snapshot_path = 9;
  optional string alert_type = 10;
  repeated Keypoint keypoints = 11;
  optional float torso_angle = 12;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACCEPTED = 1;
  STATUS_RATE_LIMITED = 2;
  STATUS_FAILED = 3;
}

message SendAlertReply {
  Status status = 1;
  google.protobuf.Timestamp delivered_at = 2;
}

service AlertService {
  rpc SendAlert(Alert) returns (SendAlertReply);
}
