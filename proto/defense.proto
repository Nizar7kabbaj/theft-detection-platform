syntax = "proto3";

package theftdetection.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";

enum DefenseVerdict {
  DEFENSE_VERDICT_UNSPECIFIED = 0;
  DEFENSE_VERDICT_ACCEPT = 1;
  DEFENSE_VERDICT_REJECT = 2;
  DEFENSE_VERDICT_DEGRADED_ACCEPT = 3;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_KEYPOINT_GEOMETRY_INVALID = 1;
  REJECTION_REASON_ANATOMICAL_BOUNDS_VIOLATED = 2;
  REJECTION_REASON_FRAME_TO_FRAME_VELOCITY_IMPLAUSIBLE = 3;
  REJECTION_REASON_OUT_OF_DISTRIBUTION = 4;
  REJECTION_REASON_ADVERSARIAL_PATTERN_FGSM = 5;
  REJECTION_REASON_ADVERSARIAL_PATTERN_PGD = 6;
  REJECTION_REASON_LOW_CONFIDENCE_KEYPOINTS = 7;
}

message ValidationRequest {
  string request_id = 1;
  int64 session_id = 2;
  int32 frame_index = 3;
  google.protobuf.Timestamp captured_at = 4;
  string camera_id = 5;
  int32 track_id = 6;

  Bbox bbox = 10;
  repeated Keypoint keypoints = 11;

  repeated Keypoint previous_keypoints = 20;
  int32 frames_since_previous = 21;
}

message ValidationReply {
  string request_id = 1;
  DefenseVerdict verdict = 2;
  RejectionReason rejection_reason = 3;
  float anomaly_score = 4;
  string detector_name = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  int32 evaluation_duration_micros = 7;
}

service DefenseService {
  rpc ValidateKeypoints(ValidationRequest) returns (ValidationReply);
}
