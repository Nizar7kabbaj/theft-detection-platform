syntax = "proto3";

package theftdetection.v1;

import "google/protobuf/timestamp.proto";

message LoginSuccess {
  string user_id = 1;
  string username = 2;
  string source_ip = 3;
  string user_agent = 4;
  repeated string roles = 5;
}

message LoginFailure {
  string username_attempted = 1;
  string source_ip = 2;
  string user_agent = 3;
  string failure_reason = 4;
  int32 attempt_count = 5;
}

message LogoutEvent {
  string user_id = 1;
  string session_id = 2;
  string source_ip = 3;
}

message DetectionWritten {
  string detection_id = 1;
  int64 session_id = 2;
  int32 frame_index = 3;
  string camera_id = 4;
  string alert_type = 5;
  float score = 6;
  int32 track_id = 7;
}

message AlertDispatched {
  string alert_id = 1;
  int64 session_id = 2;
  string camera_id = 3;
  string severity = 4;
  string alert_type = 5;
  string channel = 6;
  bool delivered = 7;
  int32 attempt_count = 8;
  string failure_reason = 9;
}

message AlertAcknowledged {
  string alert_id = 1;
  string acknowledged_by = 2;
}

message ConfigChanged {
  string actor_user_id = 1;
  string resource_kind = 2;
  string resource_id = 3;
  string field_path = 4;
  string before_value_hash = 5;
  string after_value_hash = 6;
}

message AdminAction {
  string actor_user_id = 1;
  string action = 2;
  string target_kind = 3;
  string target_id = 4;
  string reason = 5;
}

message DefenseRejected {
  int64 session_id = 1;
  int32 frame_index = 2;
  string rejection_kind = 3;
  float anomaly_score = 4;
  string detector_name = 5;
}

message DataSubjectErasure {
  string data_subject_id = 1;
  string requested_by = 2;
  repeated string scopes = 3;
  int32 records_deleted = 4;
  bool completed = 5;
}

message ServiceLifecycleEvent {
  string service_name = 1;
  string event_kind = 2;
  string version = 3;
  string hostname = 4;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_NOTICE = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_CRITICAL = 4;
}

message AuditEvent {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string source_service = 3;
  string trace_id = 4;
  string actor = 5;
  Severity severity = 6;

  oneof payload {
    LoginSuccess login_success = 20;
    LoginFailure login_failure = 21;
    LogoutEvent logout = 22;
    DetectionWritten detection_written = 23;
    AlertDispatched alert_dispatched = 24;
    AlertAcknowledged alert_acknowledged = 25;
    ConfigChanged config_changed = 26;
    AdminAction admin_action = 27;
    DefenseRejected defense_rejected = 28;
    DataSubjectErasure data_subject_erasure = 29;
    ServiceLifecycleEvent service_lifecycle = 30;
  }
}

enum AppendStatus {
  APPEND_STATUS_UNSPECIFIED = 0;
  APPEND_STATUS_ACCEPTED = 1;
  APPEND_STATUS_REJECTED = 2;
  APPEND_STATUS_RATE_LIMITED = 3;
}

message AppendEventReply {
  AppendStatus status = 1;
  string sequence_number = 2;
  string chain_hash = 3;
  google.protobuf.Timestamp persisted_at = 4;
}

message QueryEventsRequest {
  google.protobuf.Timestamp from_time = 1;
  google.protobuf.Timestamp to_time = 2;
  string source_service = 3;
  string actor = 4;
  Severity min_severity = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message QueryEventsReply {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

message VerifyChainRequest {
  string from_sequence_number = 1;
  string to_sequence_number = 2;
}

message VerifyChainReply {
  bool chain_intact = 1;
  string break_at_sequence_number = 2;
  int64 events_verified = 3;
}

service AuditService {
  rpc AppendEvent(AuditEvent) returns (AppendEventReply);
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsReply);
  rpc VerifyChain(VerifyChainRequest) returns (VerifyChainReply);
}
