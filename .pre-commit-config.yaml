repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
        exclude: ^config/(mongodb/mongod\.conf|tempo/tempo\.yml)$
      - id: end-of-file-fixer
        exclude: ^config/(mongodb/mongod\.conf|tempo/tempo\.yml)$
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^services/.*\.py$
      - id: ruff-format
        files: ^services/.*\.py$
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_tfsec
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/.tfsec/config.yml
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.530
    hooks:
      - id: checkov
        args:
          - --quiet
          - --compact
          - --framework
          - terraform
          - --directory
          - infra/terraform
          - --config-file
          - .checkov.yaml
  - repo: local
    hooks:
      - id: conftest
        name: conftest opa policies against terraform plan
        entry: conftest test --policy infra/terraform/policies/opa
        language: system
        stages: [manual]
        pass_filenames: true
        files: \.json$
      - id: grpc-tls
        name: reject plaintext grpc in service source
        entry: tools/scripts/check_grpc_tls.sh
        language: system
        types: [python]
        files: ^services/.*\.py$
      - id: client-boundary
        name: reject client directive in routing entry points
        entry: tools/scripts/check_client_boundary.sh
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.tsx$
      - id: pip-audit
        name: pip-audit (service uv.locks)
        entry: tools/scripts/pip_audit_locks.sh
        language: python
        additional_dependencies: ["uv==0.11.7", "pip-audit==2.10.0"]
        pass_filenames: false
        files: ^services/[^/]+/uv\.lock$
