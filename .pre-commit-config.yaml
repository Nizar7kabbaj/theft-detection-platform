repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
        exclude: ^config/(mongodb/mongod\.conf|tempo/tempo\.yml)$
      - id: end-of-file-fixer
        exclude: ^config/(mongodb/mongod\.conf|tempo/tempo\.yml)$
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_tfsec
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/.tfsec/config.yml

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.530
    hooks:
      - id: checkov
        args:
          - --quiet
          - --compact
          - --framework
          - terraform
          - --directory
          - infra/terraform
          - --config-file
          - .checkov.yaml

  - repo: local
    hooks:
      - id: conftest
        name: conftest opa policies against terraform plan
        entry: conftest test --policy infra/terraform/policies/opa
        language: system
        stages: [manual]
        pass_filenames: true
        files: \.json$

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        args: ["--requirement", "services/api/requirements.txt"]
